[project]
name = "omnicee-brain"
version = "0.1.0"
description = "OMNICee analytical core — regime, agents, consensus, calibration, risk"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",
  "B008",   # FastAPI Depends() in defaults is the framework idiom
  "UP042",  # str+Enum is deliberate: enums must serialise as plain strings
]
