# Add this service block to the existing render.yaml `services:` list.
# It does NOT replace the Node service — both run.
#
# Free tier reality check before you deploy:
#   * 512 MB RAM. The stack measures ~220 MB on disk. One worker only.
#   * Free services spin down when idle. The Node service must ping the
#     brain's /health as part of its existing keepalive, or the first
#     analysis after a quiet period eats a cold start.
#   * Same region as the Node service (singapore) or every call pays
#     cross-region latency.

  - type: web
    name: omnicee-brain
    runtime: python
    plan: free
    region: singapore
    rootDir: py
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn omnicee.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BRAIN_SHARED_SECRET
        generateValue: true      # Render generates it; copy into the Node service too
      - key: LOG_LEVEL
        value: info
      - key: SYMBOLS
        fromGroup: omnicee-shared
      - key: TIMEFRAMES
        fromGroup: omnicee-shared
      - key: MONGODB_URI
        fromGroup: omnicee-shared
      - key: RISK_PCT_PER_TRADE
        fromGroup: omnicee-shared
      - key: MAX_DAILY_LOSS_PCT
        fromGroup: omnicee-shared
      - key: MAX_DRAWDOWN_PCT
        fromGroup: omnicee-shared

# And add these to the EXISTING omnicee (Node) service envVars:
#
#   - key: BRAIN_URL
#     value: https://omnicee-brain.onrender.com
#   - key: BRAIN_SHARED_SECRET
#     sync: false                # paste the same value the brain generated
#   - key: BRAIN_TIMEOUT_MS
#     value: "5000"
