# ═══════════════════════════════════════════════════════════
#  OMNICEE — Render Blueprint (pure-Python backend)
#  ONE service, ONE process:
#    FastAPI REST  +  Socket.IO  +  feeds  +  engine  +  the
#    built React dashboard, all served from omnicee.api.app:asgi.
#  The Node runtime has been fully retired; there is nothing
#  left to wire between two runtimes.
# ═══════════════════════════════════════════════════════════

envVarGroups:
  - name: omnicee-shared
    envVars:
      # ── Telegram ──────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: GRADE_A_CHANNEL_ID
        sync: false

      # ── Dashboard auth ─────────────────────────────────────
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: PUBLIC_DASHBOARD_READ
        value: "true"

      # ── EA (MT5 Expert Advisor) auth ────────────────────────
      - key: EA_SECRET
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false

      # ── Data feeds ────────────────────────────────────────
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: EODHD_API_TOKEN
        sync: false
      - key: STOCKDATA_API_TOKEN
        sync: false
      - key: ALETHEIA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: PARSE_API_KEY
        sync: false
      - key: MYFXBOOK_EMAIL
        sync: false
      - key: MYFXBOOK_PASSWORD
        sync: false
      - key: DERIV_APP_ID
        value: "1089"
      - key: DISABLE_DERIV
        value: "0"

      # ── MongoDB Atlas ─────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: omnicee_db
      - key: MONGODB_MAX_POOL
        value: "5"
      - key: MONGODB_SIGNAL_TTL_DAYS
        value: "45"
      - key: MONGODB_TELEMETRY_TTL_DAYS
        value: "7"

      # ── Email OTP login (Brevo) ────────────────────────────
      - key: BREVO_API_KEY
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: EMAIL_FROM
        value: "OMNICEE <noreply@omnicee.app>"
      - key: ALLOW_DEV_OTP
        value: "false"
      - key: EMAIL_AUTH_REQUIRED
        value: "true"
      - key: LOGIN_PASSWORD
        sync: false

      # ── Trading config ────────────────────────────────────
      - key: TIMEFRAMES
        value: "M15,H1,H4,D1"
      - key: RISK_PCT_PER_TRADE
        value: "1.0"
      - key: MAX_DAILY_LOSS_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "10.0"
      - key: ACCOUNT_BALANCE
        sync: false
      - key: MIN_SIGNAL_SCORE
        value: "75"
      - key: REQUIRE_KILLZONE
        value: "false"

      # ── System ────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_RATE_LIMIT_PER_MIN
        value: "120"
      - key: CORS_ORIGIN
        value: ""

services:
  # ── Single combined service: REST + Socket.IO + feeds + engine +
  # React dashboard, all in ONE Python process. The old two-service
  # split (Node edge + Python brain) is gone: in-process calls replace
  # the HTTP hop, BRAIN_URL/BRAIN_SHARED_SECRET are no longer needed.
  - type: web
    name: omnicee
    runtime: python
    # Free tier: 512 MB RAM, spins down after ~15 min idle. Measured
    # dependency footprint is ~225 MB (see py/requirements.txt), leaving
    # headroom for the asyncio engine. Upgrade to `starter` when going live.
    plan: free
    region: singapore   # Binance/Deriv WS reachable from here (US IPs get 451)
    # Build: install Python deps, then build the React dashboard.
    # NODE_ENV=production is ambient during build, so webapp-react's dev
    # deps must be forced with --include=dev (vite lives there).
    buildCommand: pip install --no-cache-dir -r py/requirements.txt && npm --prefix webapp-react install --include=dev --fetch-retries=5 --fetch-retry-mintimeout=20000 && npm --prefix webapp-react run build && test -f webapp-react/dist/index.html
    startCommand: cd py && uvicorn omnicee.api.app:asgi --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - fromGroup: omnicee-shared
