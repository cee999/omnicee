    <script>
      // SW registration is owned by main.jsx (registerServiceWorker) to avoid
      // dual register → controllerchange → infinite reload ("stuck loading").
      // Emergency: clear stale SW if the page is stuck in a reload loop.
      (function () {
        try {
          var k = 'omnicee_sw_reload_at';
          var last = Number(sessionStorage.getItem(k) || 0);
          if (last && Date.now() - last < 15000) {
            // Likely reload loop — unregister all workers once
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              }).catch(function () {});
            }
            try { sessionStorage.removeItem(k); } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
