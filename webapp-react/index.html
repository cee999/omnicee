<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="OMNICEE — Institutional AI trading signal terminal." />
    <meta name="application-name" content="OMNICEE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OMNICEE</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OMNICEE" />
    <meta name="msapplication-TileColor" content="#05070a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Kill service workers + omnicee caches on every load so deploys open.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (String(k).indexOf('omnicee') !== -1) caches.delete(k);
              });
            }).catch(function () {});
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-void" style="margin:0;background:#020617;color:#f8fafc">
    <div id="root">
      <div id="omni-boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:Inter,ui-monospace,monospace;color:#94a3b8;font-size:12px;letter-spacing:0.08em;padding:24px;text-align:center">
        <div style="color:#22c55e;font-weight:700;letter-spacing:0.2em">OMNICEE</div>
        <div>Loading desk…</div>
        <div id="omni-boot-hint" style="color:#64748b;max-width:320px;line-height:1.5;display:none"></div>
      </div>
    </div>
    <script>
      // If the JS bundle never mounts (404 / crash), show recovery after 8s.
      setTimeout(function () {
        var root = document.getElementById('root');
        var boot = document.getElementById('omni-boot');
        if (!boot || !root || root.children.length !== 1 || root.firstElementChild !== boot) return;
        var hint = document.getElementById('omni-boot-hint');
        if (hint) {
          hint.style.display = 'block';
          hint.innerHTML = 'Shell did not start. Hard-refresh (Ctrl+Shift+R). If it keeps spinning, the deploy may be missing webapp-react/dist — check Render build logs for vite.';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
