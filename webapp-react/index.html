<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <title>OMNICEE — Institutional Signal Terminal</title>
    <!-- PWA installability — assets copied from the retired webapp/ into
         public/ so Vite ships them at dist/ root unchanged. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
    <!-- Telegram Mini App SDK — the retired webapp/index.html read
         window.Telegram.WebApp without ever loading this script, which only
         works by luck inside some Telegram clients. Loading it explicitly is
         Telegram's own documented integration method. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="bg-void">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
